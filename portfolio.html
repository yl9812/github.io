<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY PORTFOLIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background-color: #F9F9F7;
  }

  body {
    font-family: 'IBM Plex Mono', 'D2Coding', 'Nanum Gothic Coding', monospace;
  }

/* 이미지들을 여백 없이 위아래로 이어 붙이는 컨테이너 */
  .portfolio-stream {
    display: block;
    width: 100%;
    max-width: 1100px;  /* 이미지 전체가 가질 수 있는 최대 너비를 조절합니다 */
    margin: 0 auto;     /* 좌우 여백을 똑같이 주어 화면 정중앙에 배치합니다 */
    line-height: 0;     /* 인라인 이미지 사이의 미세한 간격 제거 */
  }

  .portfolio-stream img {
    width: 100%;
    height: auto;
    display: block;
    margin: 0;
    padding: 0;
    border: 0;
  }

  /* 좌측 상단 고정 BACK 버튼 */
  .back-button {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 999;
    font-family: 'IBM Plex Mono', 'D2Coding', 'Nanum Gothic Coding', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #333333;
    background-color: #F9F9F7;
    text-decoration: none;
    padding: 6px 10px;
    border: 1px solid #33333333;
  }

  .back-button:hover {
    opacity: 0.6;
  }
</style>
</head>
<body>

  <a href="index.html" class="back-button">[ BACK ]</a>

  <div class="portfolio-stream">
    <img src="portfolio01.jpg" alt="portfolio image 01" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio02.jpg" alt="portfolio image 02" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio03.jpg" alt="portfolio image 03" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio04.jpg" alt="portfolio image 04" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio05.jpg" alt="portfolio image 05" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio06.jpg" alt="portfolio image 06" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio07.jpg" alt="portfolio image 07" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio08.jpg" alt="portfolio image 08" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio09.jpg" alt="portfolio image 09" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio10.jpg" alt="portfolio image 10" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio11.jpg" alt="portfolio image 11" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio12.jpg" alt="portfolio image 12" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio13.jpg" alt="portfolio image 13" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio14.jpg" alt="portfolio image 14" onerror="this.src='https://via.placeholder.com/1920x1080'">
    <img src="portfolio15.jpg" alt="portfolio image 15" onerror="this.src='https://via.placeholder.com/1920x1080'">
  </div>

</body>
</html>
