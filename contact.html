<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  
  <!-- Fonts: IBM Plex Mono & SUIT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-api/suit/suit.css">

  <style>
    :root {
      --bg-color: #F9F9F7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      position: relative;
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.02em;
    }

    /* ---------- 1. 상단 헤더: 메뉴 아이콘 ---------- */
    .page-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 140px;
      z-index: 10;
    }

    .contact-menu-icon-fixed {
      position: absolute !important;
      left: 37.67px !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      width: 24.35px !important;
      height: 9.9px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 3.9px !important;
      cursor: pointer !important;
      flex-shrink: 0 !important;
      z-index: 1 !important;
    }

    .contact-menu-icon-fixed span {
      display: block !important;
      width: 100% !important;
      height: 1px !important;
      background-color: #333333 !important;
      margin: 0 !important;
      padding: 0 !important;
      flex-shrink: 0 !important;
      transform: none !important;
    }

    /* ---------- 2. 중앙 CONTACT 텍스트 ---------- */
    .contact-content {
      text-align: center;
      color: #0C0C0B;
      transform: translateY(-37.8px);
    }

    .contact-title {
      font-family: 'SUIT', sans-serif;
      font-weight: 700; /* SUIT-Bold */
      font-size: 17.33px;
      margin-bottom: 16.43px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .contact-line {
      font-family: 'SUIT', sans-serif;
      font-weight: 400; /* SUIT-Regular */
      font-size: 16px; /* 1pt 확대 (14.67px -> 16px) */
      margin-bottom: 11.34px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .contact-line:last-child {
      margin-bottom: 0;
    }

    /* ---------- 3. 우측 하단 푸터 텍스트 ---------- */
    .contact-footer {
      position: absolute;
      right: 103.3px;
      bottom: 61.1px;
      text-align: right;
      color: #2D2D2D;
      font-family: 'IBM Plex Mono', monospace;
      font-style: italic;
      font-weight: 400;
      font-size: 12px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ---------- 4. 메뉴창 오버레이 ---------- */
    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: all 0.5s ease-in-out;
    }

    .menu-overlay.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .menu-overlay .overlay-backdrop {
      position: absolute;
      inset: 0;
      -webkit-backdrop-filter: blur(0px) contrast(1) saturate(1);
      backdrop-filter: blur(0px) contrast(1) saturate(1);
      background-color: rgba(0, 0, 0, 0);
      transition: -webkit-backdrop-filter 0.5s ease-in-out, backdrop-filter 0.5s ease-in-out, background-color 0.5s ease-in-out;
    }

    .menu-overlay.is-active .overlay-backdrop {
      -webkit-backdrop-filter: blur(15px) contrast(1.1) saturate(1.2);
      backdrop-filter: blur(15px) contrast(1.1) saturate(1.2);
      background-color: rgba(0, 0, 0, 0.54);
    }

    .menu-overlay .overlay-backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.15;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .menu-panel-wrap {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 45px 0;
      box-sizing: border-box;
      pointer-events: none;

      opacity: 0;
      transform: translateX(-12px);
      transition: opacity 0.5s ease 0.05s, transform 0.5s ease 0.05s;
    }

    .menu-overlay.is-active .menu-panel-wrap {
      opacity: 1;
      transform: translateX(0);
    }

    .menu-panel {
      position: relative;
      height: 100%;
      display: block;
      pointer-events: auto;
    }

    .menu-panel img {
      height: 100%;
      width: auto;
      display: block;
    }

    .menu-hotspot {
      position: absolute;
      left: 34%;
      width: 30%;
      height: 6.2%;
      display: block;
    }

    .menu-hotspot--01 { top: 49.5%; }
    .menu-hotspot--02 { top: 61%; }
    .menu-hotspot--03 { top: 72.5%; }
    .menu-hotspot--04 { top: 84%; }

    .menu-hotspot--home {
      top: 12%;
      left: 28%;
      width: 12%;
      height: 4%;
    }

    .menu-hotspot:hover {
      background-color: rgba(255, 255, 255, 0.06);
    }
  </style>
</head>
<body>

  <!-- 1. 상단 헤더: 메뉴 아이콘 -->
  <div class="page-header">
    <div class="contact-menu-icon-fixed">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- 2. 중앙 CONTACT 텍스트 -->
  <div class="contact-content">
    <div class="contact-title">CONTACT</div>
    <div class="contact-line">E-mail: yl122347@gmail.com</div>
    <div class="contact-line">Instagram: ability___neighbor</div>
  </div>

  <!-- 3. 우측 하단 푸터 텍스트 -->
  <div class="contact-footer">
    If you wish to contact me or make an appointment, please get in touch.<br>
    Best regards,
  </div>

  <!-- 4. 메뉴창 오버레이 -->
  <div class="menu-overlay" id="menuOverlay">
    <div class="overlay-backdrop"></div>
    <div class="menu-panel-wrap">
      <div class="menu-panel">
        <img src="메뉴창.png" alt="menu" onerror="this.src='https://via.placeholder.com/700x900?text=%EB%A9%94%EB%89%B4%EC%B0%BD.png'">
        <a class="menu-hotspot menu-hotspot--home" href="index.html" aria-label="HOME"></a>
        <a class="menu-hotspot menu-hotspot--01" href="archiving.html" aria-label="01 ARCHIVING"></a>
        <a class="menu-hotspot menu-hotspot--02" href="portfolio.html" aria-label="02 PORTFOLIO"></a>
        <a class="menu-hotspot menu-hotspot--03" href="about.html" aria-label="03 ABOUT"></a>
        <a class="menu-hotspot menu-hotspot--04" href="contact.html" aria-label="04 CONTACT"></a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      function initMenu() {
        var overlay = document.getElementById('menuOverlay');
        var menuIcon = document.querySelector('.contact-menu-icon-fixed');
        if (!overlay || !menuIcon) return;

        overlay.classList.remove('is-active');

        if (!menuIcon.dataset.menuBound) {
          menuIcon.addEventListener('click', function () {
            overlay.classList.toggle('is-active');
          });
          menuIcon.dataset.menuBound = 'true';
        }

        if (!overlay.dataset.menuBound) {
          overlay.addEventListener('click', function (e) {
            if (!e.target.closest('.menu-panel')) {
              overlay.classList.remove('is-active');
            }
          });
          overlay.dataset.menuBound = 'true';
        }
      }

      document.addEventListener('DOMContentLoaded', initMenu);

      window.addEventListener('pageshow', function (event) {
        if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
          window.location.reload(true);
        } else {
          initMenu();
        }
      });
    })();
  </script>

</body>
</html>
